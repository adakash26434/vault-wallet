kind = "web"
previewPath = "/"
title = "Personal Key Wallet"
version = "1.0.0"
id = "artifacts/personal-key-wallet"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 23490

[services.development]
run = "pnpm --filter @workspace/personal-key-wallet run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/personal-key-wallet", "run", "build" ]
publicDir = "artifacts/personal-key-wallet/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "23490"
BASE_PATH = "/"
